<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA8FF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#2567C7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0C2D68" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="edgeStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9D4FF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#3D7DDB" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="foldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BC4FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1B4F9F" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Documento desplazado ligeramente hacia arriba y a la derecha -->
  <path
    d="M346 126
       H684
       L806 248
       V778
       Q806 824 760 824
       H346
       Q300 824 300 778
       V172
       Q300 126 346 126
       Z"
    fill="url(#cardFill)"
    stroke="url(#edgeStroke)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Pliegue superior derecho -->
  <path
    d="M684 126
       V218
       Q684 248 714 248
       H806
       Z"
    fill="url(#foldFill)"
    stroke="url(#edgeStroke)"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Zona de avatar abstracta -->
  <rect x="356" y="224" width="86" height="112" rx="24"
        fill="#8EC5FF" fill-opacity="0.28"/>
  <circle cx="399" cy="260" r="22"
          fill="#C8E4FF" fill-opacity="0.42"/>
  <path d="M372 321 Q399 284 426 321"
        fill="none"
        stroke="#C8E4FF"
        stroke-opacity="0.34"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- Líneas de información -->
  <rect x="472" y="228" width="188" height="18" rx="9"
        fill="#D5EBFF" fill-opacity="0.34"/>
  <rect x="472" y="266" width="132" height="14" rx="7"
        fill="#A9D4FF" fill-opacity="0.26"/>
  <rect x="472" y="300" width="214" height="14" rx="7"
        fill="#A9D4FF" fill-opacity="0.22"/>

  <!-- Bloques inferiores -->
  <rect x="356" y="390" width="326" height="16" rx="8"
        fill="#9BCBFF" fill-opacity="0.22"/>
  <rect x="356" y="430" width="276" height="16" rx="8"
        fill="#9BCBFF" fill-opacity="0.18"/>
  <rect x="356" y="470" width="344" height="16" rx="8"
        fill="#9BCBFF" fill-opacity="0.16"/>

  <!-- Microdetalle digital -->
  <rect x="710" y="708" width="28" height="28" rx="6"
        fill="#E4F2FF" fill-opacity="0.24"/>
  <rect x="746" y="708" width="14" height="28" rx="4"
        fill="#7FB8FF" fill-opacity="0.20"/>
</svg>
